# Every platform SmaLLM claims to run on, on every push.
#
# The engine is developed on one x86-64 Linux machine. The NEON kernels, the
# Windows file mapping and the macOS core count are code that machine never
# runs, so this is where they are run: natively on ARM, on macOS and on
# Windows, and under emulation for 32-bit ARM and RISC-V.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes anything back. Only the release workflow needs to.
permissions:
  contents: read

# A second push while the first is still building makes the first answer moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The two smallest models the golden tests know. They are the files
  # llama.cpp tests itself with.
  MODELS_URL: https://huggingface.co/ggml-org/models/resolve/main/tinyllamas
  # A small chat model in the most common quantization. It brings a chat
  # format, a byte-level tokenizer and the K block formats into the tests.
  CHAT_MODEL_URL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform runs even when one fails. Which ones broke is the
      # information worth having.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The golden tests compare the engine with llama.cpp on real models.
      # The checksums pin the files the golden results were made from.
      - name: Download the test models
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          cd "$RUNNER_TEMP/models"
          curl -fL --retry 5 --retry-delay 5 -o stories260K.gguf "$MODELS_URL/stories260K.gguf"
          curl -fL --retry 5 --retry-delay 5 -o stories15M-q4_0.gguf "$MODELS_URL/stories15M-q4_0.gguf"
          curl -fL --retry 5 --retry-delay 5 -o SmolLM2-135M-Instruct-Q4_K_M.gguf "$CHAT_MODEL_URL"
          cat > SHA256SUMS <<'EOF'
          270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  stories260K.gguf
          66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739  stories15M-q4_0.gguf
          2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d  SmolLM2-135M-Instruct-Q4_K_M.gguf
          EOF
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          echo "SMALLM_TEST_MODELS=$RUNNER_TEMP/models" >> "$GITHUB_ENV"

      # llama.cpp keeps tokenizer test files: vocabularies, tricky texts, and
      # the tokens each text becomes with the original tokenizer. They are
      # fetched from a fixed release, without the rest of the repository.
      # Tokenizing does not depend on the platform, so one runner does it.
      - name: Download llama.cpp's tokenizer tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          git clone --quiet --depth 1 --branch b11846 --filter=blob:none --sparse \
            https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" sparse-checkout set --no-cone 'models/ggml-vocab-*'
          echo "SMALLM_TEST_VOCABS=$RUNNER_TEMP/llama.cpp/models" >> "$GITHUB_ENV"
          echo "SMALLM_TEST_REQUIRE_VOCABS=1" >> "$GITHUB_ENV"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # SMALLM_TEST_REQUIRE turns a missing model into a failure, so the
      # golden tests cannot pass by skipping everything.
      - name: Run the tests
        env:
          SMALLM_TEST_REQUIRE: stories260K,stories15M-q4_0,SmolLM2-135M-Instruct-Q4_K_M
        run: cargo test --locked --workspace

      - run: cargo build --locked --release --workspace

      # The program itself, start to finish, on a real model.
      - name: Run the program
        shell: bash
        run: |
          smallm=target/release/smallm
          $smallm version
          $smallm info "$SMALLM_TEST_MODELS/stories15M-q4_0.gguf"
          story=$($smallm run "$SMALLM_TEST_MODELS/stories15M-q4_0.gguf" "Once upon a time" -n 48 --temp 0 --raw)
          echo "$story"
          [ ${#story} -gt 40 ]
          answer=$($smallm run "$SMALLM_TEST_MODELS/SmolLM2-135M-Instruct-Q4_K_M.gguf" "Name one color." -n 24 --temp 0)
          echo "$answer"
          [ ${#answer} -gt 3 ]
          $smallm bench "$SMALLM_TEST_MODELS/SmolLM2-135M-Instruct-Q4_K_M.gguf" -p 64 -n 32 -r 1

      # The C API from C: the header compiles, the library links, and a
      # program built on them runs.
      - name: Build and run the C example
        if: runner.os != 'Windows'
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/chat" capi/examples/chat.c -Icapi/include -Ltarget/release -lsmallm
          printf 'Name one color.\n\n' | LD_LIBRARY_PATH=target/release DYLD_LIBRARY_PATH=target/release \
            "$RUNNER_TEMP/chat" "$SMALLM_TEST_MODELS/SmolLM2-135M-Instruct-Q4_K_M.gguf" | tee "$RUNNER_TEMP/chat.txt"
          grep -q "tokens/s" "$RUNNER_TEMP/chat.txt"

      # The C API from Python, which loads the shared library at run time.
      # Not on Windows on Arm, where the runner's Python is an x64 program
      # and cannot load an Arm library.
      - name: Run the Python binding
        if: matrix.os != 'windows-11-arm'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) lib=target/release/smallm.dll ;;
            macOS) lib=target/release/libsmallm.dylib ;;
            *) lib=target/release/libsmallm.so ;;
          esac
          # On Windows `python3` can be a stub that only opens the Store.
          if [ "$RUNNER_OS" = Windows ]; then python=python; else python=python3; fi
          SMALLM_LIB="$PWD/$lib" "$python" bindings/python/test_smallm.py \
            "$SMALLM_TEST_MODELS/stories15M-q4_0.gguf" "$SMALLM_TEST_MODELS/SmolLM2-135M-Instruct-Q4_K_M.gguf"

      # A broken link in the documentation is a warning, and warnings are
      # easy to walk past locally.
      - name: Check the documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items

  # `rust-version` in Cargo.toml is a promise, and `install.sh` builds with
  # whatever cargo it finds, including the older one a distribution ships.
  # This job keeps the promise true, warnings included, for both kernel sets.
  msrv:
    name: build on the oldest Rust we claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read from the manifest instead of written down again here, so the
      # version cannot be raised in one place and not the other.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | tr -d '"[:space:]' | cut -d= -f2)
          echo "claimed: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: aarch64-unknown-linux-gnu

      - name: Check for x86-64 and for ARM
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --locked --workspace --all-targets
          cargo check --locked --workspace --all-targets --target aarch64-unknown-linux-gnu

  # Processors nobody has a runner for. The portable kernels are the only
  # ones these use, and 32-bit ARM is the one place where a pointer is not
  # 64 bits wide. The tests run under QEMU's user-mode emulation.
  emulated:
    name: test ${{ matrix.target }} under emulation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-musleabihf
            env_name: ARMV7_UNKNOWN_LINUX_MUSLEABIHF
            qemu: qemu-arm
          - target: riscv64gc-unknown-linux-musl
            env_name: RISCV64GC_UNKNOWN_LINUX_MUSL
            qemu: qemu-riscv64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Download a test model
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -fL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/models/stories260K.gguf" "$MODELS_URL/stories260K.gguf"
          echo "SMALLM_TEST_MODELS=$RUNNER_TEMP/models" >> "$GITHUB_ENV"

      # Rust ships a linker and the C library for these targets, so no cross
      # compiler has to be installed. Cargo runs each test program through
      # the emulator.
      - name: Run the tests
        env:
          SMALLM_TEST_REQUIRE: stories260K
        run: |
          export CARGO_TARGET_${{ matrix.env_name }}_LINKER=rust-lld
          export CARGO_TARGET_${{ matrix.env_name }}_RUNNER=${{ matrix.qemu }}
          # Static, so the test programs need no C library inside the emulator.
          export CARGO_TARGET_${{ matrix.env_name }}_RUSTFLAGS="-C target-feature=+crt-static"
          cargo test --locked --target ${{ matrix.target }}

  installers:
    name: parse the installers on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Parse install.sh
        if: runner.os != 'Windows'
        # `sh -n` on the platform's own shell: dash on Linux, bash as sh on
        # macOS. A GNU-only spelling fails here instead of on someone's Mac.
        run: sh -n install.sh

      # Both PowerShells. 5.1 is the one every copy of Windows has, and it
      # reads a script file differently from 7.
      - name: Parse install.ps1 in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'install.ps1 parses in PowerShell 7'

      - name: Parse install.ps1 in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'install.ps1 parses in Windows PowerShell 5.1'

      - name: Keep install.ps1 plain ASCII
        if: runner.os != 'Windows'
        # 5.1 reads a local .ps1 in the ANSI code page, where one byte of a
        # multi-byte character can end a string early.
        run: |
          if LC_ALL=C grep -n '[^ -~]' install.ps1; then
            echo "install.ps1 must be plain ASCII (lines above)"; exit 1
          fi

  # The installers end to end, the way someone would run them: from a
  # folder that is not the checkout. Pushes only, because a pull request's
  # merge ref is not a branch the installer can clone by name.
  install:
    name: install on ${{ matrix.os }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      SMALLM_REF: ${{ github.ref_name }}
      # Build, do not download. Once a release exists the installer would
      # rightly prefer it, and this job would stop testing the commit that
      # was just pushed.
      SMALLM_FROM_SOURCE: 1
    steps:
      - uses: actions/checkout@v7

      - name: Run install.sh, then uninstall
        if: runner.os != 'Windows'
        env:
          SMALLM_PREFIX: ${{ runner.temp }}/smallmbin
        run: |
          cd "$RUNNER_TEMP"
          sh "$GITHUB_WORKSPACE/install.sh"
          "$SMALLM_PREFIX/smallm" version
          sh "$GITHUB_WORKSPACE/install.sh" --uninstall
          test ! -e "$SMALLM_PREFIX/smallm"

      - name: Run install.ps1, then uninstall
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SMALLM_PREFIX: ${{ runner.temp }}\smallmbin
        run: |
          Set-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\install.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:SMALLM_PREFIX\smallm.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:GITHUB_WORKSPACE\install.ps1" -Uninstall
          if (Test-Path "$env:SMALLM_PREFIX\smallm.exe") { throw 'smallm.exe is still there' }
          exit 0

  # The install line exactly as the README gives it: nothing forced, so it
  # takes the newest release for the machine it is on, and builds only where
  # there is none.
  install-release:
    name: one-line install on ${{ matrix.os }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Run install.sh
        if: runner.os != 'Windows'
        env:
          SMALLM_PREFIX: ${{ runner.temp }}/smallmbin
        run: |
          cd "$RUNNER_TEMP"
          sh "$GITHUB_WORKSPACE/install.sh"
          "$SMALLM_PREFIX/smallm" version

      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SMALLM_PREFIX: ${{ runner.temp }}\smallmbin
        run: |
          Set-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\install.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:SMALLM_PREFIX\smallm.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
